apiVersion: v1
kind: Service
metadata:
  name: game-server
  namespace: 3dgam
  labels:
    app: game-server
spec:
  type: ClusterIP
  selector:
    app: game-server
  ports:
    - name: ws-http
      port: 8910
      targetPort: 8910
      protocol: TCP
---
# NodePort for direct external access on a bare-metal k3s node.
# If you have a LoadBalancer (e.g. MetalLB) or an Ingress with WS support,
# remove this and use that instead.
apiVersion: v1
kind: Service
metadata:
  name: game-server-nodeport
  namespace: 3dgam
  labels:
    app: game-server
spec:
  type: NodePort
  selector:
    app: game-server
  ports:
    - name: ws-http
      port: 8910
      targetPort: 8910
      nodePort: 30910   # clients connect to <node-ip>:30910
      protocol: TCP
