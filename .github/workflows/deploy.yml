name: Deploy Game Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.lower.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires all-lowercase image paths; github.repository may have
      # mixed-case owner names (e.g. PandaTwoxx), so we normalise here.
      - name: Lowercase image name
        id: lower
        run: |
          echo "image_name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}/game-server' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.lower.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    name: Update k8s Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch deployment image tag
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_name }}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i "s|image: .*game-server:.*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update game-server image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push
